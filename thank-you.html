    <header class="hero hero-confirm">
      <p class="prompt">$ ./checkout --status</p>
      <h1>200 OK</h1>
      <p class="tagline" id="confirm-message">
        Order confirmed. We'll email you a tracking number once it ships.
      </p>

    <main>
      <section class="about">
        <p class="prompt">$ cat receipt.txt</p>
        <p id="order-summary">
          <!--
          STAGE 1 (Google Tag): fire a manual gtag('event', 'conversion', {...}) here.
          STAGE 5 (ECW): populate a hashed email/name here as user-provided data.

        -->
          Thanks for your order.
        </p>
        <p><a href="index.html" class="text-link">&larr; back to the shop</a></p>
      </section>
    </main>

    <footer>
      <p class="prompt">$ echo $COPYRIGHT</p>
      <p>&copy; 2026 Namreh Goods.</p>
